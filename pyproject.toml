[project]
name = "neural-tts-studio"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Acj22", email = "angelcruzjimenez02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "gemini-webapi>=2.1.1",
    "imageio-ffmpeg>=0.6.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "piper-tts>=1.8.0",
    "requests>=2.34.2",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
neural-tts-studio = "neural_tts_studio:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
